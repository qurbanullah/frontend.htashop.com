# Nginx configuration for HTAShop Frontend (storefront)

server {
    listen 23050;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Per-request CSP nonce (nginx's built-in unique request id).
    set $csp_nonce $request_id;

    # Inject the nonce into the document head (so the client-side Seo component
    # can nonce its dynamically-injected JSON-LD scripts) and into the inline
    # theme script, so inline scripts are allowed without 'unsafe-inline'.
    sub_filter '<head>' '<head><meta name="csp-nonce" content="$csp_nonce">';
    sub_filter '<script>' '<script nonce="$csp_nonce">';
    sub_filter_once on;

    # Security headers. `always` makes them apply to error responses too.
    # NOTE: nginx stops inheriting `add_header` once a child location defines
    # its own `add_header`. The HTML/asset locations below therefore use
    # `expires` (not `add_header Cache-Control`) so these headers still apply.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy.
    # script-src uses a per-request nonce for inline scripts (no 'unsafe-inline')
    # and allowlists ONLY the third-party script origins the app actually loads
    # (GA4, Meta Pixel, Cloudflare Turnstile). A bare `https:` here would let any
    # HTTPS origin execute script and would make the nonce meaningless.
    # style-src keeps 'unsafe-inline' because Radix/Framer Motion set inline style
    # attributes at runtime.
    # frame-src is required so Cloudflare Turnstile can render its challenge iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce' https://www.googletagmanager.com https://connect.facebook.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.htashop.com https://cdn.htashop.com https://challenges.cloudflare.com https://www.googletagmanager.com https://*.sentry.io https://*.ingest.sentry.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.facebook.com https://*.facebook.com https://connect.facebook.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # Hashed build output — a missing file must 404, never fall back to the SPA
    # shell (which served index.html with a 200 for stale /assets/*.js requests).
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Cache static assets (1 year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;

        # Enable CORS for fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # Cache HTML files briefly (always revalidate so users get the latest bundle)
    location ~* \.(html|htm)$ {
        expires -1;
    }

    # API proxy - forward API calls to backend
    location /api {
        # Remove /api prefix and proxy to backend
        rewrite ^/api/(.*)$ /$1 break;

        # Use Docker local resolver and defer name resolution to runtime.
        # This avoids nginx failing to start when the `api` service is not yet registered.
        resolver 127.0.0.11 valid=30s;
        set $upstream "api:20050";
        proxy_pass http://$upstream;
        proxy_set_header Host api.htashop.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for API calls — restrict to known origins
        set $cors_origin "";
        if ($http_origin ~* "^https://htashop\.com$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~* "^https://www\.htashop\.com$") {
            set $cors_origin $http_origin;
        }
        # Allow localhost for development
        if ($http_origin ~* "^http://localhost:\d+$") {
            set $cors_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SEO endpoints — robots.txt + XML sitemaps + IndexNow key proxied to the API (generated dynamically)
    # NOTE: the regex is quoted because the unquoted `{8,64}` repetition would be
    # parsed as a block delimiter by nginx, truncating the pattern and failing
    # `nginx -t` (and therefore the container start).
    location ~ "^/(robots\.txt|[A-Za-z0-9]{8,64}\.txt|sitemap\.xml|sitemap-.*\.xml)$" {
        resolver 127.0.0.11 valid=30s;
        set $seo_upstream "api:20050";
        proxy_pass http://$seo_upstream$request_uri;
        proxy_set_header Host api.htashop.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"htashop_frontend","timestamp":"$time_iso8601"}';
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Always revalidate the SPA shell so users get the latest bundle hashes.
        expires -1;
    }

    # Error pages. `=404` keeps the real status for missing files (the SPA routes
    # never reach here — `try_files` serves index.html with a 200).
    error_page 404 =404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Security - hide nginx version
    server_tokens off;

    # Log configuration
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
