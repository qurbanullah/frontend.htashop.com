<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Unavailable — HTAShop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      .card {
        max-width: 480px;
        text-align: center;
        padding: 2.5rem 2rem;
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #4b5563;
        line-height: 1.5;
      }
      .code {
        font-weight: 600;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Service temporarily unavailable</h1>
      <p>
        HTAShop is having a brief hiccup. Please refresh the page or try again in a few moments.
      </p>
      <p class="code">Error 50x</p>
    </div>
  </body>
</html>
